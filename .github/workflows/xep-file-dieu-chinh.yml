name: Xep file dieu chinh vao src (chay khi can)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded files into src
        run: |
          set -e
          place() { if [ -f "$1" ]; then mkdir -p "$(dirname "$2")"; mv -f "$1" "$2"; echo "da chuyen $1 -> $2"; fi; }
          place firebase.ts src/services/firebase.ts
          place AdminPage.tsx src/components/AdminPage.tsx
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Khong co gi de commit" && exit 0
          git commit -m "Bo quy tac eflita.com, them xuat bai nop"
          git push
      - name: Start deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
