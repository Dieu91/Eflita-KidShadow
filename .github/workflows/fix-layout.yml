name: Sap xep file vao src (chay 1 lan)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move files into src
        run: |
          set -e
          mkdir -p src/components src/services src/utils src/i18n src/types
          for f in ActivationCodesPanel ActivationScreen AuthScreen ExpiredRenewalModal LessonModal Navbar; do
            mv -f "$f.tsx" "src/components/$f.tsx"
          done
          mv -f brandService.ts src/services/brandService.ts
          mv -f firebase.ts src/services/firebase.ts
          mv -f envDetector.ts src/utils/envDetector.ts
          mv -f translations.ts src/i18n/translations.ts
          mv -f index.ts src/types/index.ts
          mv -f App.tsx src/App.tsx
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Sap xep file vao dung thu muc src"
          git push
      - name: Start deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
