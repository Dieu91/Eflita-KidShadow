name: Kiem tra han hoc vien

on:
  schedule:
    - cron: '0 1 * * *'   # 08:00 sáng giờ Việt Nam mỗi ngày
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Chạy thử (không ghi dữ liệu, không tạo báo cáo)'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install firebase-admin
        run: npm install --no-save --no-package-lock --prefix scripts firebase-admin@12.7.0
      - name: Check expired learners
        id: check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: node scripts/expire-check.mjs
      - name: Create report issue
        if: steps.check.outputs.has_report == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Báo cáo hạn học viên KidShadow" --body-file report.md
