name: Xep file ma kich hoat phan trang vao src (chay khi can)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded files into src
        run: |
          set -e
          place() { if [ -f "$1" ]; then mkdir -p "$(dirname "$2")"; mv -f "$1" "$2"; echo "da chuyen $1 -> $2"; fi; }
          place ActivationCodesPanel.tsx src/components/ActivationCodesPanel.tsx
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Khong co gi de commit" && exit 0
          git commit -m "Danh sach ma: sap xep theo trang thai, tim kiem, phan trang"
          git push
      - name: Start deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
